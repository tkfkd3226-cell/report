<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow,noarchive,nosnippet,noimageindex">
  <meta name="referrer" content="no-referrer">
  <title>사건 대응 자료</title>
  <style>
    :root{
      --bg-1:#080c16;
      --bg-2:#111827;
      --text:#f8fafc;
      --muted:#aeb9ca;
      --line:rgba(255,255,255,.12);
      --shadow:0 28px 70px rgba(0,0,0,.38);
    }

    *{box-sizing:border-box}
    html,body{min-height:100%}

    body{
      margin:0;
      min-height:100dvh;
      display:grid;
      place-items:center;
      overflow-x:hidden;
      color:var(--text);
      font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",
                  "Segoe UI",Roboto,Arial,sans-serif;
      background:
        radial-gradient(circle at 12% 18%,rgba(46,116,255,.18),transparent 34%),
        radial-gradient(circle at 88% 82%,rgba(155,47,73,.22),transparent 36%),
        linear-gradient(145deg,var(--bg-1) 0%,var(--bg-2) 54%,#17131b 100%);
    }

    body::before{
      content:"";
      position:fixed;
      inset:0;
      pointer-events:none;
      opacity:.24;
      background-image:
        linear-gradient(rgba(255,255,255,.025) 1px,transparent 1px),
        linear-gradient(90deg,rgba(255,255,255,.025) 1px,transparent 1px);
      background-size:36px 36px;
      -webkit-mask-image:linear-gradient(to bottom,black,transparent 90%);
      mask-image:linear-gradient(to bottom,black,transparent 90%);
    }

    .shell{
      width:min(1040px,calc(100% - 40px));
      padding:54px 0;
      text-align:center;
    }

    .eyebrow{
      margin:0 0 11px;
      color:#8fa2bd;
      font-size:11px;
      font-weight:900;
      letter-spacing:.18em;
    }

    h1{
      margin:0;
      font-size:clamp(28px,4.4vw,48px);
      line-height:1.12;
      letter-spacing:-.055em;
    }

    .intro{
      margin:14px auto 0;
      color:var(--muted);
      font-size:clamp(13px,1.7vw,15px);
      line-height:1.65;
    }

    .cards{
      display:grid;
      grid-template-columns:repeat(2,minmax(0,1fr));
      gap:24px;
      width:min(820px,100%);
      margin:40px auto 0;
    }

    .case-card{
      position:relative;
      isolation:isolate;
      aspect-ratio:1.12;
      min-width:0;
      display:flex;
      flex-direction:column;
      justify-content:space-between;
      padding:28px;
      overflow:hidden;
      border:1px solid var(--line);
      border-radius:28px;
      color:#fff;
      text-align:left;
      text-decoration:none;
      box-shadow:var(--shadow);
      transform:translateY(0);
      transition:
        transform .26s cubic-bezier(.2,.8,.2,1),
        border-color .26s ease,
        box-shadow .26s ease;
    }

    .case-card::before{
      content:"";
      position:absolute;
      inset:0;
      z-index:-2;
      transition:transform .38s ease;
    }

    .case-card::after{
      content:"";
      position:absolute;
      inset:0;
      z-index:-1;
      background:
        linear-gradient(180deg,rgba(255,255,255,.09),transparent 35%),
        linear-gradient(0deg,rgba(4,8,16,.38),transparent 58%);
    }

    .case-card:hover,
    .case-card:focus-visible{
      transform:translateY(-8px);
      border-color:rgba(255,255,255,.27);
      box-shadow:0 36px 90px rgba(0,0,0,.48);
      outline:none;
    }

    .case-card:hover::before,
    .case-card:focus-visible::before{transform:scale(1.045)}

    .case-card.goodies::before{
      background:
        radial-gradient(circle at 82% 16%,rgba(237,145,165,.30),transparent 34%),
        linear-gradient(145deg,#111827 0%,#374151 52%,#6f1d2b 100%);
    }

    .case-card.golf::before{
      background:
        radial-gradient(circle at 82% 16%,rgba(94,234,212,.28),transparent 34%),
        linear-gradient(145deg,#111827 0%,#374151 52%,#0f766e 100%);
    }

    .card-top{
      display:flex;
      align-items:flex-start;
      justify-content:space-between;
      gap:16px;
    }

    .icon{
      width:58px;
      height:58px;
      display:grid;
      place-items:center;
      border:1px solid rgba(255,255,255,.2);
      border-radius:18px;
      background:rgba(255,255,255,.1);
      -webkit-backdrop-filter:blur(10px);
      backdrop-filter:blur(10px);
      box-shadow:inset 0 1px 0 rgba(255,255,255,.12);
    }

    .icon svg{
      width:29px;
      height:29px;
      stroke:currentColor;
    }

    .arrow{
      width:38px;
      height:38px;
      display:grid;
      place-items:center;
      border:1px solid rgba(255,255,255,.16);
      border-radius:999px;
      background:rgba(0,0,0,.14);
      font-size:19px;
      transition:transform .24s ease,background .24s ease;
    }

    .case-card:hover .arrow,
    .case-card:focus-visible .arrow{
      transform:translate(3px,-3px);
      background:rgba(255,255,255,.15);
    }

    .card-no{
      margin:0 0 10px;
      color:rgba(255,255,255,.66);
      font-size:11px;
      font-weight:900;
      letter-spacing:.12em;
    }

    .card-title{
      margin:0;
      font-size:clamp(20px,2.35vw,27px);
      line-height:1.28;
      letter-spacing:-.04em;
      word-break:keep-all;
    }

    .card-caption{
      display:flex;
      align-items:center;
      gap:8px;
      margin-top:16px;
      color:rgba(255,255,255,.72);
      font-size:12px;
      font-weight:800;
    }

    .update-note{
      margin-top:14px;
      padding:10px 11px;
      border:1px solid rgba(255,255,255,.13);
      border-radius:12px;
      background:rgba(0,0,0,.13);
      color:rgba(255,255,255,.76);
      font-size:9pt;
      font-weight:700;
      line-height:1.55;
      letter-spacing:-.015em;
      word-break:keep-all;
    }

    .update-label{
      display:block;
      margin-bottom:3px;
      color:rgba(255,255,255,.48);
      font-size:8pt;
      font-weight:900;
      letter-spacing:.08em;
    }

    .dot{
      width:6px;
      height:6px;
      flex:0 0 auto;
      border-radius:999px;
      background:#fff;
      box-shadow:0 0 0 5px rgba(255,255,255,.09);
    }

    .footer{
      margin-top:28px;
      color:#718096;
      font-size:11px;
      letter-spacing:.03em;
    }

    @media (max-width:720px){
      body{place-items:start center}

      .shell{
        width:min(440px,calc(100% - 24px));
        padding:38px 0 30px;
      }

      .cards{
        grid-template-columns:1fr;
        gap:15px;
        margin-top:29px;
      }

      .case-card{
        padding:23px;
        border-radius:23px;
      }

      .icon{
        width:52px;
        height:52px;
        border-radius:16px;
      }

      .card-title{font-size:22px}
    }

    @media (prefers-reduced-motion:reduce){
      *{scroll-behavior:auto!important;transition:none!important}
    }
  </style>
</head>
<body>
  <main class="shell">
    <p class="eyebrow">INTERNAL CASE PORTAL</p>
    <h1>사건 대응 자료</h1>
    <p class="intro">확인할 사건을 선택하면 해당 자료가 새 탭에서 열립니다.</p>

    <section class="cards" aria-label="사건 자료 선택">
      <a class="case-card goodies"
         href="https://tkfkd3226-cell.github.io/report/02"
         target="_blank"
         rel="noopener noreferrer"
         aria-label="구디즈·나우인투 민·형사 대응·채권 회수계획 새 탭으로 열기">
        <div class="card-top">
          <span class="icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M4 19V5a2 2 0 0 1 2-2h9l5 5v11a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2Z"/>
              <path d="M14 3v6h6"/>
              <path d="M8 13h8M8 17h6"/>
            </svg>
          </span>
          <span class="arrow" aria-hidden="true">↗</span>
        </div>
        <div>
          <p class="card-no">CASE 01</p>
          <h2 class="card-title">구디즈·나우인투<br>민·형사 대응·채권 회수계획</h2>
          <div class="card-caption"><span class="dot"></span>민·형사 사건 경과·가압류 및 채권 회수전략</div>
        </div>
      </a>

      <a class="case-card golf"
         href="https://tkfkd3226-cell.github.io/report/01"
         target="_blank"
         rel="noopener noreferrer"
         aria-label="이지벤처스 - 늘푸른골프 분쟁 정리 새 탭으로 열기">
        <div class="card-top">
          <span class="icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M4 21V7l8-4 8 4v14"/>
              <path d="M8 21v-5h8v5"/>
              <path d="M8 10h.01M12 10h.01M16 10h.01"/>
              <path d="M8 13h.01M12 13h.01M16 13h.01"/>
            </svg>
          </span>
          <span class="arrow" aria-hidden="true">↗</span>
        </div>
        <div>
          <p class="card-no">CASE 02</p>
          <h2 class="card-title">이지벤처스<br>늘푸른골프 분쟁 정리</h2>
          <div class="card-caption"><span class="dot"></span>소송 쟁점·증거·타임라인</div>
        </div>
      </a>
    </section>

  </main>
</body>
</html>
