<!DOCTYPE html>

<html lang="ko">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1" name="viewport"/>
<meta content="noindex,nofollow,noarchive,nosnippet,noimageindex,notranslate" name="robots"/>
<meta content="no-referrer" name="referrer"/>
<meta content="no-store, no-cache, must-revalidate, max-age=0" http-equiv="Cache-Control"/>
<title>보호된 내부 자료</title>
<style>
:root{
  --bg:#f5f7fa; --panel:#fff; --ink:#111827; --muted:#64748b; --line:#dbe2ea;
  --soft:#f8fafc; --brand:#6f1d2b; --brand2:#8b2f3f; --dark:#111827;
  --blue:#1d4ed8; --green:#0f766e; --warn:#92400e;
  --shadow:0 12px 30px rgba(15,23,42,.08); --radius:18px;
  --nav-h:61px; --toolbar-h:50px;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scrollbar-gutter:stable}
body{
  margin:0; color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Segoe UI",Roboto,Arial,sans-serif;
  background:linear-gradient(180deg,#f8fafc 0%,#f3f4f6 100%);
}
button,input{font:inherit}
button{cursor:pointer}
.wrap{width:min(1280px,calc(100% - 32px));margin:0 auto}
.hidden{display:none!important}
.hero{
  padding:18px 16px 15px;
  color:#fff;
  background:linear-gradient(135deg,#111827 0%,#374151 62%,#6f1d2b 100%);
}
.hero .wrap{display:grid;gap:5px}
.kicker{font-size:11px;font-weight:900;letter-spacing:.07em;color:#cbd5e1}
h1{margin:0;font-size:clamp(22px,3vw,30px);line-height:1.15;letter-spacing:-.04em}
.subtitle{font-size:12.5px;line-height:1.5;color:#e2e8f0}
.navbar{
  position:sticky;top:0;z-index:500;
  background:#f4f7fa;border-bottom:1px solid #d7e0e8;
  box-shadow:0 4px 12px rgba(15,23,42,.08);
}
.tabs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;padding:9px 0}
.tab{
  min-height:42px;border:1px solid #d8e1ea;border-radius:10px;background:#fff;color:#334155;
  font-size:13px;font-weight:900;box-shadow:0 2px 6px rgba(15,23,42,.05);
}
.tab:hover{background:#f8fafc;border-color:#8da2b5}
.tab.active{
  color:#fff;border-color:var(--brand);
  background:linear-gradient(135deg,var(--brand2) 0%,var(--brand) 100%);
  box-shadow:0 5px 13px rgba(111,29,43,.22);
}
main{padding:10px 0 70px}
.context-toolbar{
  position:sticky;top:var(--nav-h);z-index:430;margin-bottom:10px;
}
.context-toolbar-inner{
  min-height:44px;display:flex;align-items:center;gap:8px;padding:5px 7px;
  border:1px solid rgba(203,213,225,.95);border-radius:12px;
  background:rgba(248,250,252,.95);backdrop-filter:blur(12px);
  box-shadow:0 4px 14px rgba(15,23,42,.07);
}
.searchbox{
  flex:1;min-width:0;display:flex;align-items:center;gap:7px;
  padding:7px 10px;border:1px solid #cbd5e1;border-radius:9px;background:#fff;
}
.searchbox input{width:100%;min-width:0;border:0;outline:0;background:transparent;font-size:13px}
.toolbar-actions{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.btn{
  min-height:32px;padding:6px 10px;border:1px solid #d1d5db;border-radius:9px;
  background:#fff;color:#374151;font-size:12px;font-weight:900;
}
.btn:hover{background:#f9fafb}
.btn.active{background:#111827;color:#fff;border-color:#111827}
.count{white-space:nowrap;color:var(--muted);font-size:11px;font-weight:800}
.panel{
  background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
  box-shadow:var(--shadow);overflow:visible;
}
.panel-head{
  padding:18px 20px;border-bottom:1px solid var(--line);
  display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;
}
.panel-head h2{margin:0;font-size:22px;letter-spacing:-.03em}
.panel-head p{margin:5px 0 0;color:var(--muted);font-size:13px;line-height:1.55}
.panel-body{padding:18px}
.section-heading{
  margin:26px 0 12px;display:flex;align-items:center;gap:10px;
  font-size:18px;letter-spacing:-.025em;scroll-margin-top:calc(var(--nav-h) + var(--toolbar-h) + 12px);
}
.section-heading:first-child{margin-top:0}
.section-heading:before{content:"";width:8px;height:23px;border-radius:99px;background:var(--dark)}
.summary-note{
  padding:13px 15px;border:1px solid #dbe2ea;border-left:5px solid var(--brand);
  border-radius:13px;background:linear-gradient(135deg,#fff 0%,#f8fafc 100%);
  color:#475569;font-size:13px;line-height:1.65;
}
.metric-grid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px}
.metric-card{
  min-width:0;padding:15px;border:1px solid #dbe2ea;border-radius:15px;
  background:linear-gradient(180deg,#fff 0%,#f8fafc 100%);
}
.metric-label{color:#64748b;font-size:11px;font-weight:900}
.metric-value{margin-top:7px;color:#111827;font-size:19px;font-weight:950;letter-spacing:-.035em;word-break:keep-all}
.metric-sub{margin-top:5px;color:#94a3b8;font-size:10.5px;line-height:1.4}
.party-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.party-card{padding:13px 14px;border:1px solid #dbe2ea;border-radius:13px;background:#f8fafc}
.party-card b{display:block;margin-bottom:5px;color:#0f172a;font-size:13px}
.party-card span{color:#475569;font-size:12px;line-height:1.55}
.transaction-cards{display:grid;gap:10px}
.transaction-card{
  border:1px solid #dbe2ea;border-radius:15px;background:#fff;overflow:hidden;
  box-shadow:0 3px 10px rgba(15,23,42,.035);
}
.transaction-head{
  display:grid;grid-template-columns:62px minmax(0,1fr) auto;gap:10px;align-items:center;
  padding:12px 14px;background:#f8fafc;border-bottom:1px solid #e5e7eb;
}
.round-badge{
  width:48px;height:34px;display:flex;align-items:center;justify-content:center;
  border-radius:10px;background:#111827;color:#fff;font-size:12px;font-weight:950;
}
.transaction-title b{display:block;font-size:15px}
.transaction-title span{display:block;margin-top:3px;color:#64748b;font-size:11px}
.end-user{
  max-width:220px;padding:5px 8px;border:1px solid #c7d2fe;border-radius:999px;
  background:#eef2ff;color:#3730a3;font-size:10.5px;font-weight:900;text-align:center;white-space:pre-line;
}
.transaction-grid{
  display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:0;
}
.data-field{min-width:0;padding:11px 13px;border-right:1px solid #eef2f7;border-bottom:1px solid #eef2f7}
.data-field:nth-child(4n){border-right:0}
.data-field label{display:block;margin-bottom:5px;color:#64748b;font-size:10.5px;font-weight:900}
.data-field div{color:#334155;font-size:12px;line-height:1.5;white-space:pre-line;word-break:keep-all;overflow-wrap:anywhere}
.data-field strong{color:#111827;font-size:13px}
.transaction-foot{padding:10px 13px;background:#fbfdff;color:#64748b;font-size:11px;line-height:1.5;white-space:pre-line}
.timeline-layout{position:relative}
.timeline-section{scroll-margin-top:calc(var(--nav-h) + var(--toolbar-h) + 12px)}
.timeline-section-title{
  margin:26px 0 12px;display:flex;align-items:flex-start;gap:10px;
  font-size:18px;letter-spacing:-.025em;line-height:1.4;
}
.timeline-section-title:before{content:"";flex:0 0 8px;width:8px;height:24px;margin-top:1px;border-radius:99px;background:#111827}
.timeline{display:grid;gap:10px}
.timeline-card{
  display:grid;grid-template-columns:190px minmax(0,1fr);gap:14px;
  padding-bottom:10px;border-bottom:1px solid #edf0f4;
}
.timeline-card:last-child{border-bottom:0}
.date-pill{
  position:sticky;top:calc(var(--nav-h) + var(--toolbar-h) + 10px);align-self:start;
  padding:10px 12px;border:1px solid #dbe2ea;border-radius:13px;background:#f8fafc;
  color:#111827;font-size:12.5px;font-weight:950;line-height:1.45;text-align:center;white-space:pre-line;
}
.event-body{
  min-width:0;padding:14px;border:1px solid #dbe2ea;border-radius:15px;background:#fff;
  box-shadow:0 3px 10px rgba(15,23,42,.035);
}
.event-meta{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.badge{
  display:inline-flex;align-items:center;padding:4px 8px;border-radius:999px;
  background:#eef2ff;color:#3730a3;font-size:10.5px;font-weight:900;line-height:1.2;
}
.badge.gray{background:#f1f5f9;color:#475569}
.event-title{margin:0 0 8px;font-size:16px;letter-spacing:-.02em;line-height:1.4}
.timeline-card.expanded .timeline-card.expanded .empty{padding:35px;text-align:center;color:#64748b;font-size:13px}
mark{background:#fef08a;color:#111827;border-radius:3px;padding:0 .1em}
.floating-toc{
  position:fixed;right:12px;top:50%;transform:translateY(-50%);z-index:420;
}
.floating-toc-trigger{
  width:44px;min-height:72px;display:flex;align-items:center;justify-content:center;
  padding:9px 6px;border:1px solid #d1d5db;border-radius:14px 0 0 14px;
  background:rgba(255,255,255,.96);color:#334155;box-shadow:0 8px 22px rgba(15,23,42,.14);
  writing-mode:vertical-rl;font-size:12px;font-weight:900;
}
.floating-toc-panel{
  position:absolute;right:0;top:50%;width:330px;padding:12px;border:1px solid #d1d5db;border-radius:18px;
  background:#fff;box-shadow:0 14px 34px rgba(15,23,42,.16);
  opacity:0;visibility:hidden;pointer-events:none;transform:translateY(-50%) translateX(14px);
  transition:.16s ease;
}
.floating-toc:hover .floating-toc-panel,.floating-toc:focus-within .floating-toc-panel{
  opacity:1;visibility:visible;pointer-events:auto;transform:translateY(-50%) translateX(0);
}
.floating-toc:hover .floating-toc-trigger,.floating-toc:focus-within .floating-toc-trigger{opacity:0;visibility:hidden}
.toc-title{
  display:flex;justify-content:space-between;gap:8px;padding:0 2px 8px;margin-bottom:8px;
  border-bottom:1px solid #e5e7eb;font-size:13px;font-weight:900;
}
.toc-title small{color:#64748b;font-size:10.5px}
.toc-list{display:grid;gap:6px}
.toc-link{
  display:grid;grid-template-columns:34px minmax(0,1fr);gap:8px;align-items:center;
  min-height:38px;padding:6px 8px;border:1px solid #e5e7eb;border-radius:12px;
  background:#fff;color:#334155;text-decoration:none;
}
.toc-link:hover{background:#fff7f7;border-color:#e7a8b2;color:#6f1d2b}
.toc-no{
  width:28px;height:26px;display:flex;align-items:center;justify-content:center;
  border-radius:9px;background:#111827;color:#fff;font-size:11px;font-weight:900;
}
.toc-text{min-width:0;font-size:11.5px;font-weight:900;line-height:1.35}
.top-btn{
  position:fixed;right:18px;bottom:18px;z-index:700;width:56px;height:56px;
  border:1px solid #111827;border-radius:14px;background:#111827;color:#fff;
  box-shadow:0 12px 30px rgba(15,23,42,.22);font-size:11px;font-weight:950;
  opacity:0;visibility:hidden;transform:translateY(10px);transition:.16s ease;
}
.top-btn.visible{opacity:1;visibility:visible;transform:translateY(0)}
.mobile-menu-bar,.mobile-menu-backdrop,.mobile-menu-drawer{display:none}
.mobile-search-spacer{display:none}
@media (max-width:1000px){
  .metric-grid{grid-template-columns:repeat(3,minmax(0,1fr))}
  .transaction-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .data-field:nth-child(4n){border-right:1px solid #eef2f7}
  .data-field:nth-child(2n){border-right:0}
}
@media (max-width:760px){
  :root{--nav-h:95px;--toolbar-h:47px}
  html,body{max-width:100%;overflow-x:hidden}
  .wrap{width:calc(100% - 14px)}
  .hero{padding:11px 52px 10px 9px}
  .kicker{font-size:9px}
  h1{font-size:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .subtitle{font-size:10.5px;line-height:1.35}
  .tabs{grid-template-columns:repeat(2,minmax(0,1fr));gap:5px;padding:6px 0}
  .tab{min-height:38px;font-size:11px}
  main{padding-top:7px;padding-bottom:48px}
  .context-toolbar{position:relative;top:auto;margin-bottom:8px}
  .context-toolbar.mobile-fixed{
    position:fixed;left:7px;right:7px;bottom:max(8px,env(safe-area-inset-bottom,0px));z-index:1350;
    margin:0;background:#cfd8e3;border:1px solid #aebbc9;border-radius:12px;
    box-shadow:0 10px 26px rgba(15,23,42,.22);
  }
  .context-toolbar.mobile-fixed .context-toolbar-inner{border:0;border-radius:12px;background:linear-gradient(180deg,#e2e8f0 0%,#d7e0e9 100%);box-shadow:none}
  .context-toolbar-inner{gap:5px;padding:5px}
  .searchbox{padding:6px 8px}
  .searchbox input{font-size:11px}
  .toolbar-actions{gap:4px}
  .btn{min-height:29px;padding:5px 7px;font-size:10px}
  .count{display:none}
  .mobile-search-spacer.active{display:block}
  body.mobile-toolbar-visible main{padding-bottom:96px}
  .panel{border-radius:15px}
  .panel-head{padding:14px}
  .panel-head h2{font-size:19px}
  .panel-head p{font-size:12px}
  .panel-body{padding:10px}
  .summary-note{font-size:12px;padding:11px 12px}
  .section-heading{font-size:16px;margin:20px 0 10px}
  .metric-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:7px}
  .metric-card{padding:12px}
  .metric-value{font-size:16px}
  .party-grid{grid-template-columns:1fr}
  .transaction-head{grid-template-columns:52px minmax(0,1fr);padding:11px}
  .round-badge{width:42px;height:32px}
  .end-user{grid-column:1/-1;justify-self:start;max-width:100%;white-space:pre-line}
  .transaction-grid{grid-template-columns:1fr}
  .data-field{border-right:0!important}
  .timeline-section-title{font-size:16px;margin:20px 0 10px}
  .timeline-card{grid-template-columns:1fr;gap:7px;padding-bottom:8px}
  .date-pill{position:static;text-align:left;padding:8px 10px;font-size:12px}
  .event-body{padding:11px;border-radius:13px}
  .event-title{font-size:14.5px}
  .event-summary,  .floating-toc{display:none}
  .top-btn{
    right:10px;bottom:10px;width:52px;height:52px;border-radius:12px;
  }
  body.mobile-toolbar-visible .top-btn{bottom:78px}
  .mobile-menu-bar{
    display:block;position:fixed;top:8px;right:8px;z-index:1500;
  }
  .mobile-menu-button{
    width:34px;height:34px;padding:0;display:flex;align-items:center;justify-content:center;
    border:1px solid #111827;border-radius:6px;background:rgba(255,255,255,.78);backdrop-filter:blur(6px);
  }
  .hamburger{position:relative;width:17px;height:17px}
  .hamburger span{position:absolute;left:0;width:17px;height:2px;background:#111827;transition:.14s ease}
  .hamburger span:nth-child(1){top:3px}.hamburger span:nth-child(2){top:7.5px}.hamburger span:nth-child(3){top:12px}
  body.mobile-menu-open .hamburger span{top:7.5px}
  body.mobile-menu-open .hamburger span:nth-child(1){transform:rotate(45deg)}
  body.mobile-menu-open .hamburger span:nth-child(2){opacity:0}
  body.mobile-menu-open .hamburger span:nth-child(3){transform:rotate(-45deg)}
  .mobile-menu-backdrop{
    position:fixed;inset:0;z-index:1400;background:rgba(15,23,42,.24);
  }
  .mobile-menu-backdrop.open{display:block}
  .mobile-menu-drawer{
    position:fixed;top:48px;right:8px;z-index:1450;width:min(340px,calc(100vw - 16px));
    max-height:calc(100dvh - 62px);overflow:auto;border:1px solid #111827;border-radius:8px;
    background:#fff;box-shadow:0 14px 34px rgba(15,23,42,.22);
  }
  .mobile-menu-drawer.open{display:block}
  .mobile-menu-head{position:sticky;top:0;padding:11px 12px;border-bottom:1px solid #e5e7eb;background:#fff;font-size:13px;font-weight:900}
  .mobile-menu-list{display:grid;gap:6px;padding:9px}
  .mobile-nav-item{
    width:100%;padding:9px 10px;border:1px solid #cbd5e1;border-radius:6px;
    background:#f8fafc;color:#334155;text-align:left;font-size:12px;font-weight:850;line-height:1.4;
  }
  body.mobile-menu-open{overflow:hidden}
  body.mobile-menu-open .context-toolbar,body.mobile-menu-open .top-btn{visibility:hidden}
}
@media print{
  .navbar,.context-toolbar,.floating-toc,.top-btn,.mobile-menu-bar,.mobile-menu-backdrop,.mobile-menu-drawer{display:none!important}
  body{background:#fff}
  .hero{background:#fff;color:#111827;padding:0 0 16px}
  .kicker,.subtitle{color:#475569}
  .panel{box-shadow:none}
    .event-summary,}
</style>

.future-info-available{margin-top:9px;padding:10px 11px;border:1px solid #ead3db;border-radius:11px;background:#fff8fa}
.future-info-available b{display:block;margin-bottom:5px;color:#6f1d2b;font-size:11px}
.future-info-available p{margin:0;color:#475569;font-size:12px;line-height:1.65;word-break:keep-all;overflow-wrap:anywhere}
.future-asset-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.future-asset-card{padding:15px;border:1px solid #dbe2ea;border-radius:15px;background:linear-gradient(180deg,#fff 0%,#f8fafc 100%)}
.future-asset-note{margin-top:9px;padding:10px 11px;border-left:4px solid #6f1d2b;border-radius:0 10px 10px 0;background:#fff;color:#475569;font-size:12px;line-height:1.65}
.future-guide-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.future-guide-card{padding:15px;border:1px solid #dbe2ea;border-radius:15px;background:#fff}
.future-guide-question{display:grid;grid-template-columns:30px minmax(0,1fr);gap:9px;align-items:start}
.future-guide-question>span{width:28px;height:26px;display:flex;align-items:center;justify-content:center;border-radius:9px;background:#111827;color:#fff;font-size:10px;font-weight:950}
.future-guide-question h4{margin:2px 0 0;font-size:14px;line-height:1.45}
.future-guide-card p{margin:10px 0 0;color:#475569;font-size:12.5px;line-height:1.7;word-break:keep-all;overflow-wrap:anywhere}
@media(max-width:1000px){
  .future-asset-grid{grid-template-columns:1fr}
}
@media(max-width:760px){
  .future-info-grid,.future-guide-grid{grid-template-columns:1fr}
  .future-info-field{grid-template-columns:90px minmax(0,1fr);gap:7px}
  .future-info-card,.future-asset-card,.future-guide-card{padding:12px;border-radius:13px}
}

<script>
"use strict";
let DATA = null;

function base64ToBytes(value){
  const bin=atob(value);const bytes=new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) bytes[i]=bin.charCodeAt(i);
  return bytes;
}
async function decryptAppData(password){
  const el=document.getElementById("encryptedData");
  if(!el) throw new Error("encrypted data missing");
  if(!window.crypto||!window.crypto.subtle) throw new Error("secure crypto unavailable");
  const bundle=JSON.parse(el.textContent);
  const profiles=Array.isArray(bundle.profiles)?bundle.profiles:[bundle];
  const material=await crypto.subtle.importKey("raw",new TextEncoder().encode(password),{name:"PBKDF2"},false,["deriveKey"]);
  let lastError=null;
  for(const payload of profiles){
    try{
      const key=await crypto.subtle.deriveKey(
        {name:"PBKDF2",salt:base64ToBytes(payload.salt),iterations:payload.iterations,hash:"SHA-256"},
        material,{name:"AES-GCM",length:256},false,["decrypt"]
      );
      const decrypted=await crypto.subtle.decrypt(
        {name:"AES-GCM",iv:base64ToBytes(payload.iv)},key,base64ToBytes(payload.ciphertext)
      );
      DATA=JSON.parse(new TextDecoder().decode(decrypted));
      return;
    }catch(err){
      lastError=err;
    }
  }
  throw lastError||new Error("invalid password");
}
function unlockPage(){
  if(document.activeElement&&typeof document.activeElement.blur==="function") document.activeElement.blur();
  document.body.classList.remove("auth-locked");
  const gate=document.getElementById("authGate");
  if(gate){gate.classList.add("hidden");gate.setAttribute("aria-hidden","true");}
}
function resetScrollToTopAfterUnlock(){
  const goTop=()=>{try{window.scrollTo({top:0,left:0,behavior:"auto"});}catch(e){window.scrollTo(0,0);}};
  goTop();requestAnimationFrame(goTop);requestAnimationFrame(()=>requestAnimationFrame(goTop));
  setTimeout(goTop,80);setTimeout(goTop,250);
}
async function tryUnlockWithPassword(password){
  await decryptAppData(password);
  unlockPage();
  init();
  resetScrollToTopAfterUnlock();
}
function initAuthGate(){
  const gate=document.getElementById("authGate"),form=document.getElementById("authForm");
  const input=document.getElementById("authPassword"),error=document.getElementById("authError");
  if(!gate||!form||!input) return;
  gate.classList.remove("hidden");gate.removeAttribute("aria-hidden");
  setTimeout(()=>input.focus(),80);
  let autoSubmitTimer=0,busy=false;
  form.addEventListener("submit",async e=>{
    e.preventDefault();if(busy) return;
    const value=(input.value||"").trim();if(!value) return;
    busy=true;error.textContent="확인 중입니다...";
    try{
      await tryUnlockWithPassword(value);
      input.value="";error.textContent="";
    }catch(err){
      error.textContent=window.crypto&&window.crypto.subtle?"비밀번호가 맞지 않습니다.":"이 브라우저 환경에서는 암호화 해제가 지원되지 않습니다.";
      input.value="";input.focus();
    }finally{busy=false;}
  });
  input.addEventListener("input",()=>{
    if(autoSubmitTimer) clearTimeout(autoSubmitTimer);
    const value=(input.value||"").trim();
    if(!/^\d{4}$/.test(value)) return;
    autoSubmitTimer=setTimeout(()=>{
      autoSubmitTimer=0;
      if(!document.body.classList.contains("auth-locked")||busy) return;
      if(typeof form.requestSubmit==="function") form.requestSubmit();
      else form.dispatchEvent(new Event("submit",{bubbles:true,cancelable:true}));
    },80);
  });
}
const $ = (s, root=document) => root.querySelector(s);
const $$ = (s, root=document) => [...root.querySelectorAll(s)];

function escapeHtml(value){
  return String(value ?? "").replace(/[&<>"']/g, ch => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[ch]));
}
function formatWon(v){ return new Intl.NumberFormat("ko-KR").format(Number(v || 0)) + "원"; }
function normalize(v){ return String(v ?? "").toLocaleLowerCase("ko-KR").replace(/\s+/g," ").trim(); }
function highlight(text, term){
  const raw = String(text ?? "");
  if(!term) return escapeHtml(raw);
  const escaped = term.replace(/[.*+?^${}()|[\]\\]/g,"\\$&");
  return escapeHtml(raw).replace(new RegExp(escaped,"gi"), m => "<mark>"+m+"</mark>");
}
function sectionParts(title, index){
  const m = String(title).match(/^([ⅠⅡⅢⅣⅤⅥⅦⅧⅨⅩ]+)\.\s*(.*)$/);
  return {no:m ? m[1] : String(index+1), title:m ? m[2] : title};
}
function searchSnippet(text, term){
  if(!term) return "";
  const raw = String(text ?? "");
  const lower = raw.toLocaleLowerCase("ko-KR");
  const idx = lower.indexOf(term.toLocaleLowerCase("ko-KR"));
  if(idx < 0) return "";
  const start = Math.max(0, idx - 45), end = Math.min(raw.length, idx + term.length + 70);
  return (start ? "…" : "") + raw.slice(start,end).replace(/\n+/g," ") + (end < raw.length ? "…" : "");
}

}

}
function currentTimelineConfig(){
  return {rootId:"timelineRoot",tocId:"timelineToc",panelId:"timelinePanel",prefix:"timeline-section",sections:DATA.timelineSections,title:complaintOnly?"고소장 기재 사건 경과":"타임라인"};
}
function timelineConfigFor(){ return currentTimelineConfig(); }
function isComplaintTimelineRow(row){ return Boolean(row && row.complaintPages); }
function visibleTimelineSections(){
  return DATA.timelineSections.map((section,index)=>({
    section,index,rows:section.rows.filter(row=>!complaintOnly || isComplaintTimelineRow(row))
  })).filter(item=>item.rows.length);
}
function findEvent(sections,no){
  return sections.flatMap(s=>s.rows).find(r=>r.no===no);
}
function renderTimelineView(config){
  const root = $("#"+config.rootId);
  const q = normalize(query);
  let total = 0, html = "", visibleSections = [];
  config.sections.forEach((section, sectionIndex) => {
    const rows = section.rows.filter(r => {
      if(complaintOnly && !isComplaintTimelineRow(r)) return false;
      const fileText = (r.files || []).map(f => `${f.label} ${f.path}`).join(" ");
      const hay = normalize([section.section,r.no,r.date,r.category,r.actor,r.content,fileText,r.complaintPages||""].join(" "));
      return !q || hay.includes(q);
    });
    if(!rows.length) return;
    visibleSections.push({section,index:sectionIndex});
    html += `<section class="timeline-section" id="${config.prefix}-${sectionIndex}">
      <h3 class="timeline-section-title">${highlight(section.section,query)}</h3><div class="timeline">`;
    rows.forEach(r => {
      total++;
      html += `<article class="timeline-card" data-no="${r.no}">
        <div class="date-pill">${highlight(r.date,query)}</div>
        <div class="event-body">
          <div class="event-meta">
            <span class="badge">No. ${r.no}</span>
            <span class="badge">${highlight(r.category,query)}</span>
            <span class="badge gray">${highlight(r.actor,query)}</span>
            ${r.complaintPages ? `<span class="complaint-page-badge">고소장 ${escapeHtml(r.complaintPages)}쪽</span>` : ""}
          </div>
          <h4 class="event-title">${highlight(r.category,query)}</h4>
          <div class="event-content">${highlight(r.content,query)}</div>
          ${fileLinks(r.files)}
        </div>
      </article>`;
    });
    html += `</div></section>`;
  });
  root.innerHTML = total ? html : `<div class="empty">검색 결과가 없습니다.</div>`;
  renderTimelineToc(config,visibleSections);
  $("#visibleCount").textContent = total;
  requestAnimationFrame(updateTocLayout);
}
function renderTimeline(){renderTimelineView(currentTimelineConfig());}
function renderTimelineToc(config,items){
  const root=$("#"+config.tocId);
  if(activeTab!=="timeline" || !items.length){root.innerHTML="";return}
  root.innerHTML=`<button class="floating-toc-trigger" type="button" aria-expanded="false">목차</button>
    <div class="floating-toc-panel"><div class="toc-title"><span>${escapeHtml(config.title)}</span><small>${items.length}개 구간</small></div>
    <div class="toc-list">${items.map(item=>{
      const p=sectionParts(item.section.section,item.index);
      return `<a class="toc-link" href="#${config.prefix}-${item.index}"><span class="toc-no">${escapeHtml(p.no)}</span><span class="toc-text">${escapeHtml(p.title)}</span></a>`;
    }).join("")}</div></div>`;
  $(".floating-toc-trigger",root).addEventListener("click",e=>{
    e.stopPropagation();
    if(!root.classList.contains("is-collapsed")) return;
    root.classList.toggle("open");
    e.currentTarget.setAttribute("aria-expanded",root.classList.contains("open") ? "true" : "false");
  });
  $$(".toc-link",root).forEach(link=>link.addEventListener("click",()=>closeTimelineToc()));
}
function closeTimelineToc(){
  [$("#overviewToc"),$("#timelineToc"),$("#futureToc")].filter(Boolean).forEach(root=>{
    root.classList.remove("open");
    const trigger=$(".floating-toc-trigger",root);
    if(trigger) trigger.setAttribute("aria-expanded","false");
  });
}
function updateTocLayout(){
  const config=activeTab==="overview"
    ? {tocId:"overviewToc",panelId:"overviewPanel"}
    : activeTab==="future"
      ? {tocId:"futureToc",panelId:"futurePanel"}
      : currentTimelineConfig();
  const root=$("#"+config.tocId), panel=$("#"+config.panelId);
  if(!root || !panel || !root.children.length) return;
  if(window.innerWidth<=760){
    root.classList.remove("is-docked","is-collapsed","open");
    return;
  }
  const rect=panel.getBoundingClientRect();
  const tocWidth=292, gap=10;
  const rightSpace=window.innerWidth-rect.right;
  const docked=rightSpace >= tocWidth+gap+8;
  root.classList.toggle("is-docked",docked);
  root.classList.toggle("is-collapsed",!docked);
  if(docked){
    root.classList.remove("open");
    root.style.setProperty("--timeline-toc-x",`${Math.round(rect.right+gap)}px`);
  }else{
    const x=Math.max(8,Math.min(window.innerWidth-52,rect.right+8));
    root.style.setProperty("--timeline-toc-x",`${Math.round(x)}px`);
  }
}
function showTab(name, doScroll=true){
  const changed = activeTab !== name;
  if(changed){
    query = "";
    const input = $("#globalSearch");
    if(input) input.value = "";
  }
  activeTab=name; document.body.dataset.activeTab=name;
  const countBox=$(".count"); if(countBox) countBox.classList.toggle("hidden",name!=="timeline");
  $$(".tab").forEach(b=>b.classList.toggle("active",b.dataset.tab===name));
  $("#overviewPanel").classList.toggle("hidden",name!=="overview");
  $("#timelinePanel").classList.toggle("hidden",name!=="timeline");
  $("#futurePanel").classList.toggle("hidden",name!=="future");
  closeTimelineToc();
  if(name==="overview") renderOverview();
  else if(name==="future") renderFuturePlan();
  else renderTimeline();
  renderMobileMenu();
  if(doScroll) window.scrollTo({top:0,behavior:"smooth"});
}
function applySearch(){
  query=$("#globalSearch").value;
  if(activeTab==="overview") renderOverview();
  else if(activeTab==="future") renderFuturePlan();
  else renderTimeline();
  renderMobileMenu();
}
function renderMobileMenu(){
  const list=$("#mobileMenuList"), title=$("#mobileMenuTitle");
  if(activeTab==="overview"){
    title.textContent="사건 개요 바로가기";
    list.innerHTML=[
      ["#overview-summary","전체 요약"],["#overview-parties","주요 당사자"],["#overview-transactions","회차별 거래 현황"],["#overview-resources","관련 자료"]
    ].map(([id,label])=>`<button class="mobile-nav-item" data-target="${id}" type="button">${label}</button>`).join("");
  }else if(activeTab==="future"){
    title.textContent="향후 진행사항 바로가기";
    const items=[
      ["#future-summary","진행방향 요약"],
      ["#future-status","현재 진행상태"],
      ["#future-decisions","기본 결정사항"],
      ["#future-basic-info","확인된 상대방 기본정보"],
      ["#future-reviews","상대방별 민사조치 검토"],
      ["#future-questions","백송 검토 요청사항"],
      ["#future-guide","가압류 단계 재산확인 기준"]
    ].filter(([id])=>$(id));
    list.innerHTML=items.map(([id,label])=>`<button class="mobile-nav-item" data-target="${id}" type="button">${label}</button>`).join("");
  }else{
    const config=currentTimelineConfig();
    const sections=visibleTimelineSections();
    title.textContent=complaintOnly?"고소장 기재 사건 경과 바로가기":"타임라인 바로가기";
    list.innerHTML=sections.map(item=>{
      const p=sectionParts(item.section.section,item.index);
      return `<button class="mobile-nav-item" data-target="#${config.prefix}-${item.index}" type="button">${escapeHtml(p.no+". "+p.title)}</button>`;
    }).join("");
  }
  $$(".mobile-nav-item",list).forEach(btn=>btn.addEventListener("click",()=>{
    const target=$(btn.dataset.target);
    closeMobileMenu();
    if(target){
      requestAnimationFrame(()=>{
        const navHeight=$(".navbar")?.getBoundingClientRect().height||0;
        const top=target.getBoundingClientRect().top+window.scrollY-navHeight-6;
        window.scrollTo({top:Math.max(0,top),behavior:"smooth"});
      });
    }
  }));
}
function openMobileMenu(){
  renderMobileMenu();
  document.body.classList.add("mobile-menu-open");
  $("#mobileBackdrop").classList.add("open");
  $("#mobileDrawer").classList.add("open");
  $("#mobileDrawer").setAttribute("aria-hidden","false");
  $("#mobileMenuButton").setAttribute("aria-expanded","true");
}
function closeMobileMenu(){
  document.body.classList.remove("mobile-menu-open");
  $("#mobileBackdrop").classList.remove("open");
  $("#mobileDrawer").classList.remove("open");
  $("#mobileDrawer").setAttribute("aria-hidden","true");
  $("#mobileMenuButton").setAttribute("aria-expanded","false");
}
function updateScrollUi(){
  const y=window.scrollY;
  $("#topButton").classList.toggle("visible",y>500);
  const mobile=window.innerWidth<=760;
  const toolbar=$("#contextToolbar"), spacer=$("#mobileSearchSpacer");
  if(mobile && y>170){
    const h=toolbar.offsetHeight;
    toolbar.classList.add("mobile-fixed");
    spacer.classList.add("active");
    spacer.style.height=h+"px";
    document.body.classList.add("mobile-toolbar-visible");
  }else{
    toolbar.classList.remove("mobile-fixed");
    spacer.classList.remove("active");
    spacer.style.height="0";
    document.body.classList.remove("mobile-toolbar-visible");
  }
}

function openDirectiveModal(){
  const modal=$("#directiveModal");
  if(!modal) return;
  modal.classList.add("open");
  modal.setAttribute("aria-hidden","false");
  document.body.classList.add("modal-open");
  const closeBtn=$("#directiveModalX") || $("#directiveModalClose");
  if(closeBtn) requestAnimationFrame(()=>closeBtn.focus());
}
function closeDirectiveModal(){
  const modal=$("#directiveModal");
  if(!modal || !modal.classList.contains("open")) return;
  modal.classList.remove("open");
  modal.setAttribute("aria-hidden","true");
  document.body.classList.remove("modal-open");
  const openBtn=$("#directiveButton"); if(openBtn) openBtn.focus();
}

function init(){
  document.title=DATA.meta.title || "보호된 내부 자료";
  $("#pageTitle").textContent=DATA.meta.title;
  const directiveDate=$("#directiveDate");
  if(directiveDate) directiveDate.textContent=DATA.directives?.date || "";
  const directiveList=$("#directiveList");
  if(directiveList){
    directiveList.replaceChildren(...(DATA.directives?.items || []).map(text=>{
      const li=document.createElement("li");li.className="directive-item";li.textContent=text;return li;
    }));
  }
  const futurePanelTitle=$("#futurePanelTitle");
  if(futurePanelTitle&&DATA.futurePlan?.panelTitle) futurePanelTitle.textContent=DATA.futurePlan.panelTitle;
  const complaintSourceLink=$("#complaintSourceLink");
  if(complaintSourceLink&&DATA.complaintSource){
    complaintSourceLink.href=encodeURI(DATA.complaintSource.path || "");
    complaintSourceLink.textContent=DATA.complaintSource.label || "고소장";
  }
  $("#directiveButton").addEventListener("click",openDirectiveModal);
  $("#directiveModalClose").addEventListener("click",closeDirectiveModal);
  $("#directiveModalX").addEventListener("click",closeDirectiveModal);
  $("#directiveModal").addEventListener("click",e=>{if(e.target.id==="directiveModal") closeDirectiveModal();});
  $$(".tab").forEach(b=>b.addEventListener("click",()=>showTab(b.dataset.tab)));
  $("#globalSearch").addEventListener("input",applySearch);
  const complaintOnlyFilter=$("#complaintOnlyFilter");
  if(complaintOnlyFilter){
    complaintOnlyFilter.checked=complaintOnly;
    complaintOnlyFilter.addEventListener("change",()=>{
      complaintOnly=complaintOnlyFilter.checked;
      renderTimeline();
      renderMobileMenu();
      closeTimelineToc();
    });
  }
  $("#topButton").addEventListener("click",()=>window.scrollTo({top:0,behavior:"smooth"}));
  $("#mobileMenuButton").addEventListener("click",()=>document.body.classList.contains("mobile-menu-open")?closeMobileMenu():openMobileMenu());
  $("#mobileBackdrop").addEventListener("click",closeMobileMenu);
  window.addEventListener("scroll",updateScrollUi,{passive:true});
  window.addEventListener("resize",()=>{updateScrollUi();renderMobileMenu();updateTocLayout()});
  document.addEventListener("keydown",e=>{if(e.key==="Escape"){closeDirectiveModal();closeMobileMenu();closeTimelineToc();}});
  document.addEventListener("click",e=>{const toc=activeTab==="overview"?$("#overviewToc"):(activeTab==="future"?$("#futureToc"):$("#timelineToc"));if(toc && toc.classList.contains("is-collapsed") && !toc.contains(e.target))closeTimelineToc();});
  showTab("overview",false);
  updateScrollUi();
  updateTocLayout();
}
initAuthGate();
</script>
</body>
