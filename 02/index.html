<title>보호된 내부 자료</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Segoe UI",Roboto,Arial,sans-serif}
button,input{font:inherit}
body.auth-locked{
  overflow:hidden;position:fixed;inset:0;width:100%;height:100%;
  background:#111827;
}
.auth-gate{
  position:fixed;inset:0;z-index:10000;display:flex;align-items:center;justify-content:center;padding:22px;
  background:
    radial-gradient(circle at 20% 20%,rgba(139,47,63,.28),transparent 35%),
    radial-gradient(circle at 82% 12%,rgba(100,116,139,.22),transparent 31%),
    linear-gradient(135deg,#111827 0%,#273142 58%,#6f1d2b 100%);
  color:#fff;
}
.auth-card{
  width:min(400px,100%);padding:24px 24px 18px;border:1px solid rgba(255,255,255,.20);
  border-radius:24px;background:rgba(255,255,255,.97);color:#111827;
  box-shadow:0 30px 90px rgba(0,0,0,.34);
}
.auth-badge{
  display:inline-flex;align-items:center;gap:6px;margin-bottom:14px;padding:6px 10px;border-radius:999px;
  background:#fff1f3;color:#6f1d2b;font-size:12px;font-weight:900;
}
.auth-title{margin:0 0 16px;font-size:22px;line-height:1.3;letter-spacing:-.04em}
.auth-form{display:grid;gap:9px}
.auth-help{margin:0;color:#64748b;font-size:12px;font-weight:800;line-height:1.5;text-align:center}
.auth-input{
  width:100%;height:48px;padding:0 14px;border:1px solid #d1d5db;border-radius:14px;background:#fff;
  font-size:18px;font-weight:900;letter-spacing:.16em;text-align:center;outline:none;
}
.auth-input:focus{border-color:#6f1d2b;box-shadow:0 0 0 4px rgba(111,29,43,.14)}
.auth-input:disabled{background:#f8fafc;color:#64748b}
.auth-error{min-height:18px;margin:0;color:#dc2626;font-size:13px;font-weight:900;text-align:center}
@media(max-width:760px){
  .auth-gate{padding:16px}
  .auth-card{padding:20px 18px 15px;border-radius:22px}
  .auth-badge{margin-bottom:12px}
  .auth-title{margin-bottom:14px;font-size:19px}
  .auth-input{height:46px}
  .auth-error{min-height:17px}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body class="auth-locked">
<div aria-labelledby="authTitle" aria-modal="true" class="auth-gate" id="authGate" role="dialog">
  <div class="auth-card">
    <div class="auth-badge">🔒 내부 검토용</div>
    <h2 class="auth-title" id="authTitle">전달 받은 비밀번호 입력</h2>
    <form autocomplete="off" class="auth-form" id="authForm">
      <input aria-label="비밀번호" autocomplete="current-password" class="auth-input" id="authPassword" inputmode="numeric" maxlength="4" pattern="[0-9]*" placeholder="••••" type="password" autofocus>
      <p class="auth-help">비밀번호가 일치하면 자동으로 입장합니다.</p>
      <p aria-live="polite" class="auth-error" id="authError"></p>
    </form>
  </div>
</div>

  const form = document.getElementById('authForm');
  const input = document.getElementById('authPassword');
  const error = document.getElementById('authError');
  const encoder = new TextEncoder();
  const decoder = new TextDecoder('utf-8', {fatal:true});
  let busy = false;
  let autoSubmitTimer = 0;

  const fromBase64 = value => {
    const binary = atob(value);
    const bytes = new Uint8Array(binary.length);
    for (let i = 0; i < binary.length; i += 1) bytes[i] = binary.charCodeAt(i);
    return bytes;
  };

  async function deriveKey(secret) {
    const material = await crypto.subtle.importKey(
      'raw', encoder.encode(secret), {name:'PBKDF2'}, false, ['deriveKey']
    );
    return crypto.subtle.deriveKey(
      {name:'PBKDF2', salt:fromBase64(SALT), iterations:ITERATIONS, hash:'SHA-256'},
      material,
      {name:'AES-GCM', length:256},
      false,
      ['decrypt']
    );
  }

  async function unlock(secret) {
    const key = await deriveKey(secret);
    const decrypted = await crypto.subtle.decrypt(
      {name:'AES-GCM', iv:fromBase64(IV)}, key, fromBase64(PAYLOAD)
    );
    return decoder.decode(decrypted);
  }

  function setBusy(value) {
    busy = value;
    input.disabled = value;
  }

  input.addEventListener('input', () => {
    input.value = input.value.replace(/\D/g, '').slice(0, 4);
    error.textContent = '';
    if (autoSubmitTimer) clearTimeout(autoSubmitTimer);
    if (!/^\d{4}$/.test(input.value) || busy) return;
    autoSubmitTimer = setTimeout(() => {
      autoSubmitTimer = 0;
      if (!busy && typeof form.requestSubmit === 'function') form.requestSubmit();
      else if (!busy) form.dispatchEvent(new Event('submit', {bubbles:true,cancelable:true}));
    }, 80);
  });

  form.addEventListener('submit', async event => {
    event.preventDefault();
    if (busy) return;
    const secret = input.value.trim();
    if (!/^\d{4}$/.test(secret)) return;
    if (!window.crypto || !window.crypto.subtle) {
      error.textContent = '이 브라우저 환경에서는 암호화 해제가 지원되지 않습니다.';
      return;
    }
    setBusy(true);
    error.textContent = '확인 중입니다...';
    try {
      const source = await unlock(secret);
      input.value = '';
      document.open();
      document.write(source);
      document.close();
    } catch (err) {
      setBusy(false);
      error.textContent = '비밀번호가 맞지 않습니다.';
      input.value = '';
      input.focus();
    }
  });

  setTimeout(() => input.focus(), 80);
})();
